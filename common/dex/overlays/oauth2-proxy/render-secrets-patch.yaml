apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: auth
spec:
  template:
    spec:
      volumes:
        - name: dex-config-template
          configMap:
            name: dex
            items:
              - key: config.yaml
                path: config.yaml

        - name: dex-config-rendered
          emptyDir:
            medium: Memory

      initContainers:
        - name: render-dex-config
          image: python:3.12-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: dex-oidc-client
          command:
            - python
            - -c
            - |
              import os
              import re
              from pathlib import Path

              template_path = Path("/etc/dex/template/config.yaml")
              rendered_path = Path("/etc/dex/cfg/config.yaml")

              template = template_path.read_text()
              pattern = re.compile(r"__([A-Za-z_][A-Za-z0-9_]*)__")
              missing = set()

              def replace_placeholder(match):
                  env_name = match.group(1)
                  value = os.environ.get(env_name)
                  if value is None:
                      missing.add(env_name)
                      return match.group(0)
                  return value

              rendered = pattern.sub(replace_placeholder, template)

              if missing:
                  missing_list = ", ".join(sorted(missing))
                  raise SystemExit(f"Missing required environment variables: {missing_list}")

              rendered_path.parent.mkdir(parents=True, exist_ok=True)
              rendered_path.write_text(rendered)

          volumeMounts:
            - name: dex-config-template
              mountPath: /etc/dex/template
              readOnly: true

            - name: dex-config-rendered
              mountPath: /etc/dex/cfg

      containers:
        - name: dex
          command:
            - dex
            - serve
            - /etc/dex/cfg/config.yaml
          args: []
          volumeMounts:
            - name: dex-config-rendered
              mountPath: /etc/dex/cfg
              readOnly: true
