apiVersion: apps/v1
kind: Deployment
metadata:
  name: centraldashboard
  namespace: kubeflow
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: centraldashboard
          image: kubeflow/central-dashboard:v1.10.0-prefixed-namespaces
          imagePullPolicy: IfNotPresent
