# kthcloud/00-foundation/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep your sort options here to ensure CRDs apply before instances
sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
      - Namespace
      - CustomResourceDefinition
      - MutatingWebhookConfiguration
      - ValidatingWebhookConfiguration
      - ResourceQuota
      - StorageClass
      - ServiceAccount
      - PodSecurityPolicy
      - NetworkPolicy
      - Role
      - ClusterRole
      - RoleBinding
      - ClusterRoleBinding
      - ConfigMap
      - Secret
      - Endpoints
      - Service
      - LimitRange
      - PriorityClass
      - PersistentVolume
      - PersistentVolumeClaim
      - Deployment
      - StatefulSet
      - CronJob
      - PodDisruptionBudget

resources:
  # Cert-Manager
  - ../../common/cert-manager/overlays/kubeflow
  # - ../../common/cert-manager/overlays/existing-cert-manager
  # Istio
  - ../../common/istio/istio-crds/base
  - ../../common/istio/istio-namespace/base
  - ../../common/istio/istio-install/overlays/oauth2-proxy

  # Oauth2-proxy & Dex
  - ../../common/oauth2-proxy/overlays/m2m-dex-only
  - ../../common/dex/overlays/oauth2-proxy

  # KNative & Gateways
  - ../../common/knative/knative-serving/overlays/gateways
  - ../../common/istio/cluster-local-gateway/base

  # Core RBAC and Istio routing for Kubeflow
  - ../../common/kubeflow-roles/base
  - ../../common/istio/kubeflow-istio-resources/base

  # Base Namespaces & Policies
  - ../../common/kubeflow-namespace/base
  #- ../../common/user-namespace/base
  #- ../../common/networkpolicies/base
